[workspace]
resolver = "3"
members = ["crates/link-core", "crates/nebo-link", "crates/nebo-runtimes", "crates/oal-conformance", "crates/oal-relay", "crates/oal-secure"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/NeboLoop/nebo-link"

[workspace.dependencies]
nebo-runtimes = { path = "crates/nebo-runtimes" }
link-core = { path = "crates/link-core" }
# The NeboAI hub client, shared with Nebo. Pinned to a nebo commit until
# nebo-comm is published to crates.io; then this becomes a version.
nebo-comm = { git = "https://github.com/NeboLoop/nebo", rev = "4b03c2c2a390123e2230a40f663bb484ae617365" }
# Nebo's updater, for self-update from nebo-link's signed release feed.
nebo-updater = { git = "https://github.com/NeboLoop/nebo", rev = "4b03c2c2a390123e2230a40f663bb484ae617365" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
dirs = "6"
json5 = "1"
yaml_serde = "0.10"
tempfile = "3"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
libc = "0.2"
getrandom = "0.2"
uuid = { version = "1", features = ["v4"] }
tracing-appender = "0.2"
# nebo-comm dials the hub with tokio-tungstenite using the OS trust store.
# A background service can't always read it (a macOS launchd agent got "no
# native root CA certificates found"; minimal Linux images have none), so
# the bundled Mozilla roots back it up. The OS store is still used when it
# can be read.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
yamux = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
# The OAL conformance suite checks frames against spec/schemas.
jsonschema = { version = "0.58", default-features = false }
# Its client dials wss:// hosts and relays with ring, the provider the rest of the
# workspace already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# oal-secure: end-to-end encryption for OAL. Noise sessions, CPace pairing on
# ristretto255, X25519 device keys; no primitives of our own.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "std"] }
curve25519-dalek = { version = "4", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# Decoding and re-encoding compressed text bodies the proxy rewrites.
flate2 = "1"
brotli = "8"
# oal-relay: the relay's proof of possession (with x25519-dalek above), its
# store, and its optional built-in TLS (ring, the provider the rest of the
# workspace already uses).
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
form_urlencoded = "1"
