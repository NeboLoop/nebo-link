# Release: build, sign and publish the five nebo-link binaries.
#
# Builds run on NeboAI's own machines, never on GitHub-hosted runners (the
# same rule as Nebo's releases; scripts/check-release-runners.py enforces it):
#   - macOS arm64 + amd64: the house Mac mini ([self-hosted, macOS, stadium-mac])
#   - Linux arm64: the Mac mini's Lima VM ([self-hosted, Linux, ARM64, neboloop])
#   - Linux amd64: a DigitalOcean droplet that exists only for this run
#   - Windows amd64: the house Windows box ([self-hosted, Windows, X64, stadium-win])
# The ubuntu-latest jobs only orchestrate (key checks, droplet lifecycle,
# checksums, uploads); nothing is compiled there.
#
# Output per tag (CDN https://cdn.neboai.com/nebo-link/releases/<tag>/ and the
# GitHub Release): nebo-link-{darwin,linux}-{arm64,amd64},
# nebo-link-windows-amd64.exe, SHA256SUMS and SHA256SUMS.sig (base64 ed25519
# signature over SHA256SUMS, made with NEBO_LINK_SIGNING_KEY). The public half
# of that key is compiled into every binary as NEBO_LINK_RELEASE_KEY so the
# self-updater can verify the next release.
#
# workflow_dispatch with dry_run (the default) builds, signs and checks
# everything, then stops: no GitHub Release, no CDN upload, no version.json.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign only: no GitHub Release, no CDN upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95"
  CARGO_TERM_COLOR: always

jobs:
  # ─── Release mode, version check, release key ────────────────────────
  prepare:
    runs-on: ubuntu-latest # orchestration only — no build happens here
    outputs:
      dry_run: ${{ steps.mode.outputs.dry_run }}
      release_key: ${{ steps.key.outputs.release_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Release mode and version
        id: mode
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != true ] && [ "$REF_TYPE" != tag ]; then
            echo "::error::A release runs from a tag (vX.Y.Z). Run this from a tag, or turn dry_run on."
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            VERSION=$(python3 - <<'EOF'
          import tomllib
          ws = tomllib.load(open("Cargo.toml", "rb"))
          pkg = tomllib.load(open("crates/nebo-link/Cargo.toml", "rb"))["package"]
          v = pkg["version"]
          print(ws["workspace"]["package"]["version"] if isinstance(v, dict) else v)
          EOF
            )
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match the version in Cargo.toml (v$VERSION). Bump the version or fix the tag."
              exit 1
            fi
            echo "Tag $TAG matches Cargo.toml"
          fi

      - name: Derive the release public key
        id: key
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          NEBO_LINK_SIGNING_KEY: ${{ secrets.NEBO_LINK_SIGNING_KEY }}
        run: |
          if [ -z "$NEBO_LINK_SIGNING_KEY" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::warning::NEBO_LINK_SIGNING_KEY is not set. This dry run builds without a release key and skips signing."
              echo "release_key=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::The NEBO_LINK_SIGNING_KEY secret is missing. Add it to the repository secrets, then run the release again."
            exit 1
          fi
          umask 077
          KEY="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$NEBO_LINK_SIGNING_KEY" > "$KEY"
          TEXT=$(openssl pkey -in "$KEY" -noout -text 2>/dev/null) || TEXT=""
          case "$TEXT" in
            "ED25519 Private-Key"*) ;;
            *)
              rm -f "$KEY"
              echo "::error::NEBO_LINK_SIGNING_KEY is not an ed25519 private key in PEM (openssl genpkey -algorithm ed25519)."
              exit 1
              ;;
          esac
          PUB=$(openssl pkey -in "$KEY" -pubout -outform DER | tail -c 32 | base64)
          rm -f "$KEY"
          echo "Release public key: $PUB"
          echo "release_key=$PUB" >> "$GITHUB_OUTPUT"

  # ─── macOS builds (arm64 native, amd64 cross-compiled on the arm64 Mac) ──
  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    runs-on: [self-hosted, macOS, stadium-mac] # the house Mac mini — see nebo CLAUDE.md "Release builds"
    env:
      RUSTC_WRAPPER: ""
      # Beside the checkout, not in it: actions/checkout wipes the workspace
      # every run; beside it the build cache persists between runs.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../nebo-link-target-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::error::The APPLE_CERTIFICATE_P12 secret is missing. macOS binaries ship signed or not at all."
            exit 1
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Apple's Developer ID intermediates. A hosted Mac ships them; the
          # house Mac mini does not, and without them codesign cannot chain the
          # leaf to Apple's root ("unable to build chain to self-signed root",
          # errSecInternalComponent — Nebo v0.14.0's Intel build).
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -sSf -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN_PATH"
            rm "$RUNNER_TEMP/$ca.cer"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Build nebo-link
        env:
          # cc-rs derives -arch from the cargo target; never set global
          # CFLAGS/CMAKE_OSX_ARCHITECTURES (they leak into host build scripts).
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          RELEASE_KEY: ${{ needs.prepare.outputs.release_key }}
        run: |
          # Only set when there is a key: option_env! would read an empty
          # value as a key.
          if [ -n "$RELEASE_KEY" ]; then export NEBO_LINK_RELEASE_KEY="$RELEASE_KEY"; fi
          cargo build --release --locked -p nebo-link --bin nebo-link --target ${{ matrix.target }}
          cp "$CARGO_TARGET_DIR/${{ matrix.target }}/release/nebo-link" nebo-link-darwin-${{ matrix.arch }}
          [ "$(lipo -archs nebo-link-darwin-${{ matrix.arch }})" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}" ]

      - name: Sign with Developer ID
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$SIGN_IDENTITY" \
            --identifier dev.neboai.nebo-link \
            --timestamp \
            --options runtime \
            nebo-link-darwin-${{ matrix.arch }}
          codesign --verify --strict --verbose=2 nebo-link-darwin-${{ matrix.arch }}
          codesign -dvv nebo-link-darwin-${{ matrix.arch }} 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|flags)'

      - uses: actions/upload-artifact@v4
        with:
          name: nebo-link-darwin-${{ matrix.arch }}
          path: nebo-link-darwin-${{ matrix.arch }}
          if-no-files-found: error

  # ─── Notarize macOS binaries (separate job, cheap to re-run) ─────────
  # Split from the build like Nebo's, so a notarization failure re-runs in
  # minutes against the signed binary. A bare Mach-O cannot be stapled:
  # notarytool takes it zipped (ditto), and Gatekeeper finds the ticket online
  # by the binary's code hash. Only an explicit "Accepted" lets the release on.
  notarize-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    runs-on: [self-hosted, macOS, stadium-mac] # the house Mac mini — see nebo CLAUDE.md "Release builds"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nebo-link-darwin-${{ matrix.arch }}

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then
            echo "::error::The APPLE_ID secret is missing. macOS binaries ship notarized or not at all."
            exit 1
          fi
          BIN=nebo-link-darwin-${{ matrix.arch }}
          codesign --verify --strict "$BIN"
          ZIP="$RUNNER_TEMP/$BIN.zip"
          rm -f "$ZIP"
          ditto -c -k --keepParent "$BIN" "$ZIP"
          echo "Submitting $BIN for notarization..."
          # Capture output without aborting (default shell is `bash -eo pipefail`)
          # so we can print the result + fetch the detailed log before deciding.
          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)
          set -e
          rm -f "$ZIP"
          echo "$SUBMIT_OUT"
          SUB_ID=$(echo "$SUBMIT_OUT" | grep -m1 "id:" | awk '{print $2}')
          if [ -n "$SUB_ID" ]; then
            echo "--- notarization log ($SUB_ID) ---"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 || true
          fi
          if ! echo "$SUBMIT_OUT" | grep -q "status: Accepted"; then
            echo "::error::Notarization did NOT succeed — refusing to ship an un-notarized build."
            exit 1
          fi
          echo "Notarization accepted."

  # ─── Linux amd64 runner: a droplet that exists only for this run ───────
  # Copied from Nebo's release: no house x86 machine, and Rosetta on the
  # arm64 VM killed amd64 processes at random. This boots a droplet from the
  # golden snapshot, hands it a just-in-time org runner registration good for
  # ONE job, and linux-amd64-runner-down deletes it whatever happens.
  linux-amd64-runner:
    needs: prepare
    runs-on: ubuntu-latest # orchestration only — no build happens here
    outputs:
      droplet_id: ${{ steps.droplet.outputs.id }}
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # A just-in-time runner carries ONLY the labels named here, so the
      # build's runs-on list must be spelled out in full.
      - name: Mint a one-job runner registration
        id: jit
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          cfg=$(gh api -X POST orgs/${{ github.repository_owner }}/actions/runners/generate-jitconfig \
            -f name="do-link-amd64-${{ github.run_id }}" -F runner_group_id=1 -f work_folder=_work \
            -f "labels[]=self-hosted" -f "labels[]=Linux" -f "labels[]=X64" \
            -f "labels[]=nebo-amd64-${{ github.run_id }}" -q .encoded_jit_config)
          echo "::add-mask::$cfg"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
      - name: Boot the droplet from the golden snapshot
        id: droplet
        run: |
          image=$(doctl compute image list-user --format ID,Name --no-header | awk '$2=="nebo-runner-amd64-base"{print $1}' | tail -n1)
          test -n "$image" || { echo "snapshot nebo-runner-amd64-base not found"; exit 1; }
          cat > user-data.sh <<'EOS'
          #!/bin/bash
          # A droplet booted from a snapshot comes up with root's password
          # expired, which blocks even key-based SSH; clear that so the box
          # can be inspected while it lives.
          chage -d "$(date +%F)" -M -1 root
          cd /home/runner/actions-runner
          nohup sudo -u runner ./run.sh --jitconfig '__JIT__' > /home/runner/runner.log 2>&1 &
          EOS
          sed -i "s|__JIT__|${{ steps.jit.outputs.config }}|" user-data.sh
          # --ssh-keys: with no key DigitalOcean emails the owner a root
          # password for every build droplet. Any account key suppresses that.
          # nyc3 capacity comes and goes per size; every candidate is the same
          # 16 GB / 320 GB-disk shape the snapshot needs. Any other error is fatal.
          id=""
          for size in s-8vcpu-16gb s-8vcpu-16gb-amd s-8vcpu-16gb-intel s-4vcpu-16gb-320gb-intel; do
            if id=$(doctl compute droplet create "nebo-link-ci-amd64-${{ github.run_id }}" \
                --region nyc3 --size "$size" --image "$image" \
                --tag-names nebo-ci-runner,run-${{ github.run_id }} \
                --ssh-keys 15:57:9d:98:dc:e4:b9:b5:69:e2:42:d8:08:86:08:86 \
                --user-data-file user-data.sh --wait --format ID --no-header 2>create.err); then
              echo "droplet size: $size"; break
            fi
            grep -q "not available in this region" create.err || { cat create.err; exit 1; }
            echo "$size is not available in nyc3 right now, trying the next size"
          done
          rm -f create.err
          [ -n "$id" ] || { echo "::error::no droplet size available in nyc3"; exit 1; }
          rm -f user-data.sh
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Wait for the runner to come online
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=do-link-amd64-${{ github.run_id }}" -q '.runners[0].status // "absent"')
            [ "$status" = online ] && { echo "runner online after $((i*10))s"; exit 0; }
            sleep 10
          done
          echo "runner never came online"; exit 1

  # ─── Linux builds (native on each arch; glibc floor 2.39 like Nebo) ────
  build-linux:
    needs: [prepare, linux-amd64-runner]
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 builds natively on the house Mac mini's Lima VM (label
          # neboloop); amd64 on the droplet the job above just created.
          # Never a GitHub-hosted runner.
          - runner: [self-hosted, Linux, ARM64, neboloop]
            arch: arm64
          - runner: [self-hosted, Linux, X64, "nebo-amd64-${{ github.run_id }}"]
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTC_WRAPPER: ""
      # Persistent build cache beside the checkout. On the VM it survives
      # between runs; on the droplet it is simply the build dir.
      CARGO_TARGET_DIR: ${{ github.workspace }}/../nebo-link-target-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build nebo-link
        env:
          RELEASE_KEY: ${{ needs.prepare.outputs.release_key }}
        run: |
          # Only set when there is a key: option_env! would read an empty
          # value as a key.
          if [ -n "$RELEASE_KEY" ]; then export NEBO_LINK_RELEASE_KEY="$RELEASE_KEY"; fi
          cargo build --release --locked -p nebo-link --bin nebo-link
          cp "$CARGO_TARGET_DIR/release/nebo-link" nebo-link-linux-${{ matrix.arch }}

      # Built on Ubuntu 24.04 (glibc 2.39), the same floor Nebo's Linux
      # binaries have. A newer build host would silently raise it.
      - name: Check the glibc floor
        run: |
          NEED=$(objdump -T nebo-link-linux-${{ matrix.arch }} | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "requires glibc $NEED"
          if [ "$(printf '%s\n2.39\n' "$NEED" | sort -V | tail -n1)" != 2.39 ]; then
            echo "::error::nebo-link-linux-${{ matrix.arch }} needs glibc $NEED, above the 2.39 floor. Build on an Ubuntu 24.04 host."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nebo-link-linux-${{ matrix.arch }}
          path: nebo-link-linux-${{ matrix.arch }}
          if-no-files-found: error

  # The droplet is deleted whether the amd64 build passed, failed, or never
  # started. The one-job runner has already removed itself from the org.
  linux-amd64-runner-down:
    needs: [linux-amd64-runner, build-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest # orchestration only — no build happens here
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Delete this run's droplet, and any runner droplet older than three hours
        run: |
          doctl compute droplet delete --force --tag-name "run-${{ github.run_id }}" || true
          cutoff=$(date -u -d '3 hours ago' +%s)
          doctl compute droplet list --tag-name nebo-ci-runner --format ID,Created --no-header | while read -r id created; do
            [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ] && doctl compute droplet delete --force "$id" || true
          done
      # A one-job runner removes itself after its job; if the job never ran,
      # its registration would linger as offline. Remove it either way.
      - name: Remove the runner registration
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          id=$(gh api "orgs/${{ github.repository_owner }}/actions/runners?name=do-link-amd64-${{ github.run_id }}" -q '.runners[0].id // empty')
          [ -n "$id" ] && gh api -X DELETE "orgs/${{ github.repository_owner }}/actions/runners/$id" || true

  # ─── Windows build (house Windows box) ───────────────────────────────
  build-windows:
    needs: prepare
    runs-on: [self-hosted, Windows, X64, stadium-win] # the house Windows box — see nebo CLAUDE.md "Release builds"
    env:
      RUSTC_WRAPPER: ""
      # Beside the checkout, as on the other house runners, so the cache
      # survives checkout's wipe of the workspace.
      CARGO_TARGET_DIR: ${{ github.workspace }}\..\nebo-link-target-windows
    steps:
      - uses: actions/checkout@v4

      # The house box's machine execution policy is Restricted and the
      # runner service runs as NETWORK SERVICE, which cannot change that but
      # can set its own (CurrentUser outranks LocalMachine); Git's bin is not
      # on that account's PATH either. This cmd step, which neither affects,
      # sets the policy, puts Git's bin and a portable PowerShell 7 (for the
      # composite actions that ask for pwsh) on the job's PATH. Proven by
      # nebo's .github/workflows/windows-runner-check.yml.
      - name: Runner prep (no admin needed)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; Get-ExecutionPolicy -List | Out-String"
          echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
          echo C:\Program Files\Git\usr\bin>> "%GITHUB_PATH%"
          set PWSH_DIR=%RUNNER_TEMP%\..\..\pwsh7
          if not exist "%PWSH_DIR%\pwsh.exe" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol='Tls12'; Invoke-WebRequest -Uri https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.zip -OutFile pwsh.zip; Expand-Archive -Force pwsh.zip '%PWSH_DIR%'; Remove-Item pwsh.zip"
          )
          "%PWSH_DIR%\pwsh.exe" -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; $PSVersionTable.PSVersion.ToString()"
          echo %PWSH_DIR%>> "%GITHUB_PATH%"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Build nebo-link
        shell: bash
        env:
          RELEASE_KEY: ${{ needs.prepare.outputs.release_key }}
        run: |
          # Only set when there is a key: option_env! would read an empty
          # value as a key.
          if [ -n "$RELEASE_KEY" ]; then export NEBO_LINK_RELEASE_KEY="$RELEASE_KEY"; fi
          cargo build --release --locked -p nebo-link --bin nebo-link
          mkdir -p unsigned
          cp "$CARGO_TARGET_DIR/release/nebo-link.exe" unsigned/nebo-link-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-amd64
          path: unsigned/nebo-link-windows-amd64.exe
          if-no-files-found: error

  # ─── Sign the Windows binary (Azure Trusted Signing) ─────────────────
  sign-windows:
    needs: build-windows
    runs-on: [self-hosted, Windows, X64, stadium-win] # the house Windows box — see nebo CLAUDE.md "Release builds"
    steps:
      # Same prep as build-windows (see the comment there).
      - name: Runner prep (no admin needed)
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; Get-ExecutionPolicy -List | Out-String"
          echo C:\Program Files\Git\bin>> "%GITHUB_PATH%"
          echo C:\Program Files\Git\usr\bin>> "%GITHUB_PATH%"
          set PWSH_DIR=%RUNNER_TEMP%\..\..\pwsh7
          if not exist "%PWSH_DIR%\pwsh.exe" (
            powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol='Tls12'; Invoke-WebRequest -Uri https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/PowerShell-7.4.6-win-x64.zip -OutFile pwsh.zip; Expand-Archive -Force pwsh.zip '%PWSH_DIR%'; Remove-Item pwsh.zip"
          )
          "%PWSH_DIR%\pwsh.exe" -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force; $PSVersionTable.PSVersion.ToString()"
          echo %PWSH_DIR%>> "%GITHUB_PATH%"

      - name: Signing configuration present
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "::error::Windows signing is not configured: the AZURE_* secrets and the AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE variables are required."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: unsigned-windows-amd64
          path: to-sign/

      - name: .NET SDK for the signing tool (no admin needed)
        # azure/trusted-signing-action installs its `sign` CLI as a .NET tool,
        # which needs an SDK; the house Windows box has only the runtime
        # ("No .NET SDKs were found", Nebo v0.15.0). A portable SDK beside the
        # runner, like pwsh7 above, installed once and reused.
        shell: cmd
        run: |
          set DOTNET_DIR=%RUNNER_TEMP%\..\..\dotnet-sdk
          if not exist "%DOTNET_DIR%\dotnet.exe" (
            pwsh -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol='Tls12'; Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1; ./dotnet-install.ps1 -Channel 8.0 -InstallDir '%DOTNET_DIR%' -NoPath; Remove-Item dotnet-install.ps1"
          )
          echo DOTNET_ROOT=%DOTNET_DIR%>> "%GITHUB_ENV%"
          echo %DOTNET_DIR%>> "%GITHUB_PATH%"
          "%DOTNET_DIR%\dotnet.exe" --list-sdks

      - name: Sign binary (Authenticode)
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/to-sign
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature to-sign/nebo-link-windows-amd64.exe
          "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "nebo-link-windows-amd64.exe is not validly signed"; exit 1 }

      # Upload (not cache): the ubuntu release job can't read a Windows-saved cache.
      - uses: actions/upload-artifact@v4
        with:
          name: nebo-link-windows-amd64
          path: to-sign/nebo-link-windows-amd64.exe
          if-no-files-found: error

  # ─── Checksums, signature, CDN + GitHub Release ─────────────────────
  # Needs every platform: SHA256SUMS always covers exactly the five binaries.
  release:
    needs: [prepare, notarize-macos, build-linux, sign-windows]
    runs-on: ubuntu-latest # orchestration only — no build happens here (OpenSSL 3 for ed25519)
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ needs.prepare.outputs.dry_run }}
      RELEASE_KEY: ${{ needs.prepare.outputs.release_key }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nebo-link-*
          path: artifacts/
          merge-multiple: true

      - name: Check the five binaries
        working-directory: artifacts
        run: |
          ls -la
          for f in nebo-link-darwin-amd64 nebo-link-darwin-arm64 nebo-link-linux-amd64 nebo-link-linux-arm64 nebo-link-windows-amd64.exe; do
            [ -s "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          [ "$(find . -maxdepth 1 -type f | wc -l)" -eq 5 ] || { echo "::error::expected exactly five binaries"; exit 1; }
          chmod +x nebo-link-*

      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum nebo-link-* | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Sign SHA256SUMS
        working-directory: artifacts
        env:
          NEBO_LINK_SIGNING_KEY: ${{ secrets.NEBO_LINK_SIGNING_KEY }}
        run: |
          openssl version
          if [ -z "$NEBO_LINK_SIGNING_KEY" ]; then
            [ "$DRY_RUN" = true ] || { echo "::error::The NEBO_LINK_SIGNING_KEY secret is missing."; exit 1; }
            echo "::warning::Dry run without NEBO_LINK_SIGNING_KEY: SHA256SUMS is not signed."
            exit 0
          fi
          umask 077
          KEY="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$NEBO_LINK_SIGNING_KEY" > "$KEY"
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in SHA256SUMS | base64 | tr -d '\n' > SHA256SUMS.sig
          rm -f "$KEY"
          cat SHA256SUMS.sig; echo

      # Verified against the key compiled into the binaries, the way the
      # self-updater and /link.sh will verify it. Fails closed.
      - name: Verify SHA256SUMS.sig
        if: ${{ env.RELEASE_KEY != '' }}
        working-directory: artifacts
        run: |
          PUB="$RUNNER_TEMP/release-pub.pem"
          {
            echo "-----BEGIN PUBLIC KEY-----"
            # DER SubjectPublicKeyInfo header for ed25519 (302a300506032b6570032100) + the raw key
            { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "$RELEASE_KEY" | base64 -d; } | base64
            echo "-----END PUBLIC KEY-----"
          } > "$PUB"
          base64 -d SHA256SUMS.sig > "$RUNNER_TEMP/SHA256SUMS.sig.raw"
          [ "$(wc -c < "$RUNNER_TEMP/SHA256SUMS.sig.raw")" -eq 64 ] || { echo "::error::signature is not 64 bytes"; exit 1; }
          openssl pkeyutl -verify -pubin -inkey "$PUB" -rawin -in SHA256SUMS -sigfile "$RUNNER_TEMP/SHA256SUMS.sig.raw"

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/
          retention-days: 7

      - name: Upload release assets to CDN
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::error::The DO_SPACES_ACCESS_KEY secret is missing."; exit 1; }
          # Per-tag assets are immutable; the pointer is written last (below),
          # after the GitHub Release, so it never names files that are not up.
          for f in artifacts/*; do
            aws s3 cp "$f" "s3://neboloop/nebo-link/releases/${TAG}/$(basename "$f")" \
              --endpoint-url "$S3_ENDPOINT" --acl public-read
          done
          echo "Uploaded release assets to CDN: nebo-link/releases/${TAG}/"

      # Draft first, every asset uploaded ONE AT A TIME with retries, then
      # published (Nebo v0.14.3: parallel uploads timed out and left a draft
      # with a random subset). --clobber resumes cleanly on a re-run.
      - name: Create GitHub Release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --generate-notes --title "$TAG"
          for f in artifacts/*; do
            for attempt in 1 2 3; do
              gh release upload "$TAG" "$f" --clobber && break
              [ "$attempt" = 3 ] && exit 1
              echo "::warning::upload of $(basename "$f") failed, attempt $attempt — retrying"
              sleep 15
            done
          done
          gh release edit "$TAG" --draft=false

      - name: Point version.json at this release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          S3_ENDPOINT: https://nyc3.digitaloceanspaces.com
        run: |
          # Read the current pointer from the storage ORIGIN, never the CDN
          # edge (Nebo v0.13.3: the edge served an 18-minute-old copy). A
          # re-run of an older tag must not move the pointer backwards.
          PREV=$(aws s3 cp s3://neboloop/nebo-link/releases/version.json - --endpoint-url "$S3_ENDPOINT" 2>/dev/null || echo '{}')
          rc=0
          PREV="$PREV" TAG="$TAG" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" python3 - > version.json <<'EOF' || rc=$?
          import datetime, json, os, re, sys
          def ver(t):
              m = re.match(r"v?(\d+)\.(\d+)\.(\d+)", t or "")
              return tuple(int(x) for x in m.groups()) if m else (0, 0, 0)
          try:
              prev = json.loads(os.environ["PREV"] or "{}")
          except ValueError:
              prev = {}
          tag = os.environ["TAG"]
          if ver(prev.get("version")) > ver(tag):
              print(f"version.json already points at {prev['version']}, newer than {tag}; leaving it", file=sys.stderr)
              sys.exit(3)
          print(json.dumps({
              "version": tag,
              "release_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {"darwin": tag, "linux": tag, "windows": tag},
          }, indent=2))
          EOF
          if [ "$rc" = 3 ]; then
            echo "::warning::version.json left unchanged (it points at a newer release)."
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          cat version.json
          # Short TTL on purpose: this object is MUTABLE and is how every
          # update check learns a release exists.
          aws s3 cp version.json s3://neboloop/nebo-link/releases/version.json \
            --endpoint-url "$S3_ENDPOINT" --acl public-read --content-type application/json \
            --cache-control "public, max-age=60"
