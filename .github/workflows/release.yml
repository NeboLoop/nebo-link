# Release: a vX.Y.Z tag (or a dry run started by hand) runs the release build
# in release-build.yml, ALWAYS as it is on main. The build checks out the
# tag's code, but its steps come from main: the Mac and Windows release
# runners accept only release-build.yml@refs/heads/main, so the tag cannot
# change what runs on them. See release-build.yml for what a release does.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign only: no GitHub Release, no CDN upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # the GitHub Release (release-build.yml's release job)
    uses: NeboLoop/nebo-link/.github/workflows/release-build.yml@main
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets: inherit
