[package]
name = "link-command"
description = "The one constructor for every child process the link starts: no console window on Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies: `tokio::process::Command` is made from the std one
# (tokio's own `From`), so callers bring tokio and this crate needs none.

[dev-dependencies]
tokio = { workspace = true }
