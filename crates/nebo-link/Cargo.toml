[package]
name = "nebo-link"
description = "Link an OpenClaw or Hermes agent to NeboAI: reach and manage it from your phone and the web."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nebo-link"
path = "src/main.rs"

[dependencies]
nebo-runtimes = { workspace = true }
nebo-comm = { workspace = true }
nebo-updater = { workspace = true }
base64 = { workspace = true }
tokio-util = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
yamux = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
