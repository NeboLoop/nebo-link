[package]
name = "oal-relay"
description = "The self-hostable relay for Open Agent Link (OAL): hosts dial out, paired clients reach them, and the relay forwards frames it never needs to read."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://openagent.link"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oal-relay"
path = "src/main.rs"
required-features = ["server"]

[features]
# The relay itself (store, HTTP server, TLS, CLI). A host or client that only
# dials a relay builds with `default-features = false`.
default = ["server"]
server = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:rusqlite",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:form_urlencoded",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:dirs",
]

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
futures = { workspace = true }
yamux = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
x25519-dalek = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["json"] }
dirs = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The relay carries the OAL conformance suite's fake client and fake host.
oal-conformance = { path = "../oal-conformance" }
# Hosts make pairing codes with oal-secure; the relay only sees nameplates.
oal-secure = { path = "../oal-secure" }
